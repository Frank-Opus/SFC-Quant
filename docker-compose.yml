services:
  backend:
    build:
      context: ./backend
      args:
        BACKEND_EXTRAS: ${BACKEND_EXTRAS:-}
        INSTALL_STRATEGY_PROVIDERS: ${INSTALL_STRATEGY_PROVIDERS:-0}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${BUILD_ALL_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
    container_name: dsfc-quant-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_MODE: ${APP_MODE:-mock}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      EIA_API_KEY: ${EIA_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      STRATEGY_FACTORY_ENABLED: ${STRATEGY_FACTORY_ENABLED:-false}
      STRATEGY_FACTORY_PROVIDER: ${STRATEGY_FACTORY_PROVIDER:-mock_rdq}
      STRATEGY_FACTORY_WORKSPACE: ${STRATEGY_FACTORY_WORKSPACE:-./var/strategy_factory}
      STRATEGY_FACTORY_AUTO_GENERATE: ${STRATEGY_FACTORY_AUTO_GENERATE:-false}
      STRATEGY_FACTORY_RD_AGENT_COMMAND: ${STRATEGY_FACTORY_RD_AGENT_COMMAND:-python /app/scripts/run_rdagent.py fin_quant}
      STRATEGY_FACTORY_RD_AGENT_TIMEOUT_SECONDS: ${STRATEGY_FACTORY_RD_AGENT_TIMEOUT_SECONDS:-900}
      STRATEGY_FACTORY_TRADINGAGENTS_COMMAND: ${STRATEGY_FACTORY_TRADINGAGENTS_COMMAND:-python /app/scripts/run_tradingagents.py}
      STRATEGY_FACTORY_TRADINGAGENTS_TIMEOUT_SECONDS: ${STRATEGY_FACTORY_TRADINGAGENTS_TIMEOUT_SECONDS:-900}
      DSFC_STRATEGY_PROVIDER_VENDOR_ROOT: ${DSFC_STRATEGY_PROVIDER_VENDOR_ROOT:-/app/vendor/strategy_providers}
      RDAGENT_REPO: ${RDAGENT_REPO:-}
      TRADINGAGENTS_REPO: ${TRADINGAGENTS_REPO:-}
      EXCHANGE_ID: ${EXCHANGE_ID:-binance}
      EXCHANGE_API_KEY: ${EXCHANGE_API_KEY:-}
      EXCHANGE_API_SECRET: ${EXCHANGE_API_SECRET:-}
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-real}
      EXECUTION_MODE: ${EXECUTION_MODE:-paper}
      EXECUTION_ADAPTER: ${EXECUTION_ADAPTER:-freqtrade_mock}
      EXECUTION_FREQTRADE_REST_BASE_URL: ${EXECUTION_FREQTRADE_REST_BASE_URL:-}
      EXECUTION_FREQTRADE_REST_USERNAME: ${EXECUTION_FREQTRADE_REST_USERNAME:-}
      EXECUTION_FREQTRADE_REST_PASSWORD: ${EXECUTION_FREQTRADE_REST_PASSWORD:-}
      EXECUTION_FREQTRADE_REST_TIMEOUT_SECONDS: ${EXECUTION_FREQTRADE_REST_TIMEOUT_SECONDS:-10}
      EXECUTION_FREQTRADE_REST_ORDER_TYPE: ${EXECUTION_FREQTRADE_REST_ORDER_TYPE:-market}
      EXECUTION_ENGINE_START_PAUSED: ${EXECUTION_ENGINE_START_PAUSED:-false}
      EXECUTION_PAPER_STARTING_BALANCE: ${EXECUTION_PAPER_STARTING_BALANCE:-10000}
      EXECUTION_ORDER_NOTIONAL_USD: ${EXECUTION_ORDER_NOTIONAL_USD:-500}
      EXECUTION_FEE_RATE: ${EXECUTION_FEE_RATE:-0.001}
      EXECUTION_MAX_RECENT_ORDERS: ${EXECUTION_MAX_RECENT_ORDERS:-50}
      RISK_MAX_POSITION_NOTIONAL_USD: ${RISK_MAX_POSITION_NOTIONAL_USD:-1000}
      RISK_MAX_CONCURRENT_TRADES: ${RISK_MAX_CONCURRENT_TRADES:-3}
      RISK_DAILY_LOSS_LIMIT_USD: ${RISK_DAILY_LOSS_LIMIT_USD:-250}
      RISK_BLOCKED_SYMBOLS: ${RISK_BLOCKED_SYMBOLS:-}
      RISK_REQUIRE_AGENT_APPROVAL: ${RISK_REQUIRE_AGENT_APPROVAL:-true}
      RISK_MIN_APPROVAL_CONFIDENCE: ${RISK_MIN_APPROVAL_CONFIDENCE:-0.55}
      FRONTEND_API_URL: ${FRONTEND_API_URL:-http://backend:8000}
      FRONTEND_WS_URL: ${FRONTEND_WS_URL:-ws://backend:8000/ws}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-^https?://(localhost|127\\.0\\.0\\.1)(:\\d+)?$}
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-BTC/USDT,ETH/USDT}
      MARKET_TIMEFRAMES: ${MARKET_TIMEFRAMES:-1m,5m}
      MARKET_HISTORY_LIMIT: ${MARKET_HISTORY_LIMIT:-24}
      MARKET_POLL_INTERVAL_SECONDS: ${MARKET_POLL_INTERVAL_SECONDS:-3}
      MARKET_EVENT_BUFFER_SIZE: ${MARKET_EVENT_BUFFER_SIZE:-100}
      MARKET_STREAM_ENABLED: ${MARKET_STREAM_ENABLED:-true}
      EVENT_LOG_DIR: ${EVENT_LOG_DIR:-./var/events}
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-}
      ALL_PROXY: ${CONTAINER_ALL_PROXY:-}
      NO_PROXY: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,backend,host.docker.internal}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else sys.exit(1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        ALL_PROXY: ${BUILD_ALL_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
    container_name: dsfc-quant-frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FRONTEND_API_URL: ${FRONTEND_API_URL:-http://backend:8000}
      FRONTEND_WS_URL: ${FRONTEND_WS_URL:-ws://backend:8000/ws}
      VITE_API_BASE_URL: ${FRONTEND_API_URL:-http://backend:8000}
      VITE_WS_URL: ${FRONTEND_WS_URL:-ws://backend:8000/ws}
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-}
      ALL_PROXY: ${CONTAINER_ALL_PROXY:-}
      NO_PROXY: ${CONTAINER_NO_PROXY:-localhost,127.0.0.1,backend,host.docker.internal}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
