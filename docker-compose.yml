services:
  backend:
    build:
      context: ./backend
    container_name: dsfc-quant-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_MODE: ${APP_MODE:-mock}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      EXCHANGE_ID: ${EXCHANGE_ID:-binance}
      EXCHANGE_API_KEY: ${EXCHANGE_API_KEY:-}
      EXCHANGE_API_SECRET: ${EXCHANGE_API_SECRET:-}
      FRONTEND_API_URL: ${FRONTEND_API_URL:-http://backend:8000}
      FRONTEND_WS_URL: ${FRONTEND_WS_URL:-ws://backend:8000/ws}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-BTC/USDT,ETH/USDT}
      MARKET_TIMEFRAMES: ${MARKET_TIMEFRAMES:-1m,5m}
      MARKET_HISTORY_LIMIT: ${MARKET_HISTORY_LIMIT:-24}
      MARKET_POLL_INTERVAL_SECONDS: ${MARKET_POLL_INTERVAL_SECONDS:-3}
      MARKET_EVENT_BUFFER_SIZE: ${MARKET_EVENT_BUFFER_SIZE:-100}
      MARKET_STREAM_ENABLED: ${MARKET_STREAM_ENABLED:-true}
      EVENT_LOG_DIR: ${EVENT_LOG_DIR:-./var/events}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else sys.exit(1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: dsfc-quant-frontend
    environment:
      FRONTEND_API_URL: ${FRONTEND_API_URL:-http://backend:8000}
      FRONTEND_WS_URL: ${FRONTEND_WS_URL:-ws://backend:8000/ws}
      VITE_API_BASE_URL: ${FRONTEND_API_URL:-http://backend:8000}
      VITE_WS_URL: ${FRONTEND_WS_URL:-ws://backend:8000/ws}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
